name: Automated Release

enabled : false

on:
  push:
    branches:
      - main

jobs:
  release:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node.js (for npm authentication)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: bun install

      - name: Run Build
        run: bun run build

      # Optional: Configure Git credentials if your release script pushes version commits back to main
      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish Core Package
        run: bun run release:core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Consumer Package
        run: bun run release:consumer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}